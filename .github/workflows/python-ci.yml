name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: uv sync --locked
      # This repository ships no Python of its own. The pins in pyproject.toml are the
      # library contract that platforms/chatgpt/knowledge/data-analysis-guide.md teaches
      # the agent to write against, so the check that matters is that the resolved
      # environment actually matches those pins — an import alone would still pass after
      # the lockfile drifted to a different major version.
      - name: Verify the public dependency contract matches its pins
        run: uv run --no-sync python scripts/check_dependency_contract.py
